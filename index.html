{t:'Le refus du CNO',w:'10 h, chambre de M. Dupont',say:'« Non, je n’en veux pas. Ça m’écœure. »',mood:'sad',

 nb:{s:'« Infirmière, mon verre est vide ! Dites à Dupont de goûter, ça lui fera du bien ! »',o:[['Je le sers vite et je lui demande d’encourager M. Dupont à goûter avec lui','M. Dupont esquisse un sourire : « Bon… une gorgée, avec vous, Martin. »'],['Je lui demande d’attendre, je termine avec M. Dupont','M. Martin patiente. M. Dupont reste concentré sur vous mais ne se détend pas.'],['Je lui demande de ne pas intervenir','M. Martin se vexe et M. Dupont se referme encore davantage.']]},proj:['Proposer le CNO frais en collation (16 h et 21 h)','Déterminer ses préférences alimentaires','Surveiller les apports (réglette, fiche alimentaire)','Prévenir la diététicienne si le refus persiste','Lui expliquer le régime hyperprotéique prescrit','Retirer le CNO du projet de soins']},
{t:'« J’ai mal, je ne marche plus »',w:'14 h, début de la mobilisation',say:'« Aïe ! J’ai mal, arrêtez ! Je ne marcherai plus. »',mood:'pain',

 nb:{s:'« Infirmière, j’ai trop chaud ! Vous pouvez ouvrir la fenêtre ? »',o:[['Je lui réponds que j’arrive dans quelques minutes et je reste auprès de M. Dupont','M. Martin patiente. M. Dupont se sent en sécurité.'],['Je m’éloigne pour ouvrir la fenêtre, M. Dupont reste assis au bord du lit','M. Dupont vacille : il a failli glisser du lit.'],['Je lui dis d’appeler une collègue avec la sonnette','Une collègue arrive pour M. Martin, vous restez auprès de M. Dupont.']]},proj:['Évaluer la douleur avant chaque lever (EVA)','Demander un antalgique à anticiper avant la mobilisation','Adapter le transfert pour éviter l’appui sacré','Reprendre la marche progressivement, relais kiné si besoin','Informer le médecin : douleur et pansement sacré décollé','Ne plus le mobiliser jusqu’à la fin du séjour']},
{t:'Désorienté pendant le soin',w:'8 h 30, toilette au lit',say:'« Où est ma femme ? Je dois aller au travail ! Qui êtes-vous ? »',mood:'agit',

 hyp:['Début de confusion aiguë, dont il faut chercher la cause','Démence évoluée, il n’y a rien à faire','Il fait semblant pour éviter la toilette','Simple fatigue du matin'],

 nb:{s:'« Il était déjà perdu cette nuit, il se levait ! Et moi, il me faut le bassin ! »',o:[['Je l’écoute quelques secondes : l’agitation nocturne est une information à transmettre','M. Martin précise : « Il s’est levé trois fois, il cherchait sa femme. » Information notée.'],['Je m’éloigne chercher le bassin, je laisse M. Dupont seul','M. Dupont tente de se lever, la perfusion se tend.'],['Je sonne une collègue pour M. Martin','Une collègue prend en charge M. Martin, vous restez avec M. Dupont.']]},proj:['Surveiller l’état neurologique (orientation, discours)','Rechercher une cause (douleur, déshydratation, globe vésical, infection…)','Prévenir l’infirmier référent et le médecin','Prévenir les chutes (lit bas, environnement)','Horloge et calendrier dans la chambre, réorientation à chaque passage','Ne prévenir personne pour ne pas inquiéter']},
{t:'Surveillances alimentaires insuffisantes',w:'15 h, soin d’hygiène',say:'« Je ne sais plus si j’ai mangé ce midi… »',mood:'sad',

 act:[['Je recueille l’information (collègue, plateau, patient), je note « estimé » et je complète la fiche','« Je crois que j’ai mangé la soupe. »','Une collègue confirme environ un tiers du plateau. La fiche est complétée.','calm'],['Je note « a bien mangé » pour compléter la fiche','(il hoche la tête)','La donnée inventée masque un apport insuffisant.','sad'],['Je laisse vide, quelqu’un d’autre s’en chargera','…','Toujours aucune donnée. La dernière pesée date de 4 jours.','sad']],

function tone(f,d,v,ty,t0){const a=ac();if(!a||!snd)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(t0||0);o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function thud(t0,v){const a=ac();if(!a||!snd)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(50,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.16)}
